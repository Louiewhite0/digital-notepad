<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Notepad</title>
<style>
body{font-family:Arial;background:#fefce8;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:300px;padding:15px;box-sizing:border-box;border:1px solid #eab308;border-radius:9px;font-size:16px}
button{padding:11px 17px;margin-top:12px;background:#ca8a04;color:white;border:0;border-radius:7px;cursor:pointer}
#status{color:#15803d}
</style>
</head>
<body>
<main>
<h1>Digital Notepad</h1>
<p>Your notes are automatically saved in this browser.</p>
<textarea id="note" placeholder="Start writing..."></textarea>
<p id="status">Ready.</p>
<button onclick="saveNote()">Save Now</button>
<button onclick="downloadNote()">Download Note</button>
<button onclick="clearNote()">Clear Note</button>
</main>
<script>
const note=document.getElementById("note");
const status=document.getElementById("status");
note.value=localStorage.getItem("digitalNote")||"";
note.addEventListener("input",()=>{
 localStorage.setItem("digitalNote",note.value);
 status.textContent="Changes saved automatically.";
});
function saveNote(){
 localStorage.setItem("digitalNote",note.value);
 status.textContent="Note saved successfully.";
}
function downloadNote(){
 const blob=new Blob([note.value],{type:"text/plain"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="my-note.txt";
 a.click();
 URL.revokeObjectURL(url);
 status.textContent="Download started.";
}
function clearNote(){
 if(!confirm("Are you sure you want to clear this note?"))return;
 note.value="";
 localStorage.removeItem("digitalNote");
 status.textContent="Note cleared.";
}
</script>
</body>
</html>
