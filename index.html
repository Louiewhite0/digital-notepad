<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Notepad</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px}
main{max-width:750px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:320px;padding:15px;box-sizing:border-box;border:1px solid #94a3b8;border-radius:8px;font-size:16px;resize:vertical}
button{background:#334155;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:5px}
#status{color:#15803d}
</style>
</head>
<body>
<main>
<h1>Digital Notepad</h1>
<p>Write, save and export your personal notes.</p>
<textarea id="note" placeholder="Start writing..." oninput="saveNote()"></textarea>
<p id="status"></p>
<button onclick="downloadNote()">Download TXT</button>
<button onclick="clearNote()">Clear Note</button>
</main>
<script>
const note=document.getElementById("note");
note.value=localStorage.getItem("digitalNotepad")||"";
function saveNote(){
 localStorage.setItem("digitalNotepad",note.value);
 document.getElementById("status").textContent=
 "Saved locally | Characters: "+note.value.length;
}
function downloadNote(){
 const blob=new Blob([note.value],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download="my-note.txt";
 link.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearNote(){
 if(!confirm("Clear your saved note?"))return;
 note.value="";
 saveNote();
}
saveNote();
</script>
</body>
</html>
